<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress — Speakly AI</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon" style="width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.9rem">S</div>
        <span class="font-bold">Speakly AI</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="speaking.html" class="sidebar-link">AI Speaking</a>
        <a href="progress.html" class="sidebar-link active">Progress</a>
        <a href="vocabulary.html" class="sidebar-link">Vocabulary</a>
        <a href="history.html" class="sidebar-link">History</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="page-header">
        <h1 class="page-title" data-i18n="my_progress">My Progress</h1>
        <button class="btn btn-ghost btn-icon" data-theme-toggle data-theme-icon></button>
      </header>
      <div class="page-body">
        <div class="dashboard-stats mb-6">
          <div class="card"><div class="stat-card"><div class="stat-icon purple"></div><div><div class="stat-value" id="pSessions">0</div><div class="stat-label">Sessions</div></div></div></div>
          <div class="card"><div class="stat-card"><div class="stat-icon cyan"></div><div><div class="stat-value" id="pMinutes">0</div><div class="stat-label">Minutes</div></div></div></div>
          <div class="card"><div class="stat-card"><div class="stat-icon green"></div><div><div class="stat-value" id="pAvg">0</div><div class="stat-label">Avg Score</div></div></div></div>
        </div>
        <div class="grid grid-2">
          <div class="card">
            <h3 class="mb-4">Weekly Activity (minutes)</h3>
            <canvas id="weeklyChart" height="200"></canvas>
          </div>
          <div class="card">
            <h3 class="mb-4">Score History</h3>
            <canvas id="scoreChart" height="200"></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/localization.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/progress.js"></script>
</body>
</html>
