<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Speakly AI</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>
    <div class="card auth-card">
      <div class="auth-logo">
        <div class="logo-icon">S</div>
        <h2>Reset password</h2>
        <p class="text-muted">Enter your email and we'll send a reset link (demo).</p>
      </div>
      <form id="forgotForm" onsubmit="event.preventDefault();App.toast('If this email exists, a reset link was sent (demo).','success');">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" required placeholder="you@example.com" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>
      <div class="auth-footer">
        <a href="login.html">← Back to login</a>
      </div>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/localization.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
