<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Speaking — Speakly AI</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="app-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon" style="width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.9rem">S</div>
        <span class="font-bold">Speakly AI</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="speaking.html" class="sidebar-link">AI Speaking</a>
        <a href="ielts.html" class="sidebar-link active">IELTS</a>
        <a href="cefr.html" class="sidebar-link">CEFR</a>
        <a href="progress.html" class="sidebar-link">Progress</a>
        <a href="history.html" class="sidebar-link">History</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="page-header">
        <h1 class="page-title">IELTS Speaking Practice</h1>
        <button class="btn btn-ghost btn-icon" data-theme-toggle data-theme-icon></button>
      </header>
      <div class="page-body">
        <div class="card mb-6" style="background:linear-gradient(135deg,rgba(118,87,246,0.15),rgba(56,201,232,0.1));border-color:var(--primary)">
          <p class="text-sm"><strong>Note:</strong> Scores are AI practice estimates only and are not official IELTS band scores.</p>
        </div>
        <div class="tabs">
          <button class="tab active" data-ielts-part="1">Part 1</button>
          <button class="tab" data-ielts-part="2">Part 2</button>
          <button class="tab" data-ielts-part="3">Part 3</button>
        </div>
        <div id="ieltsContent"></div>
        <div class="mt-6">
          <button id="startIeltsBtn" class="btn btn-primary">Start full AI speaking session</button>
        </div>
      </div>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/localization.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ielts.js"></script>
</body>
</html>
