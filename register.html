<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Speakly AI</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>
    <div class="card auth-card" style="max-width:480px">
      <div class="auth-logo">
        <div class="logo-icon">S</div>
        <h2 data-i18n="register_title">Create account</h2>
        <p class="text-muted" data-i18n="register_sub">Start speaking with AI today</p>
      </div>
      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" data-i18n="full_name">Full Name</label>
          <input type="text" name="fullName" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="email">Email</label>
          <input type="email" name="email" class="form-input" required />
        </div>
        <div class="grid grid-2" style="gap:12px">
          <div class="form-group">
            <label class="form-label" data-i18n="password">Password</label>
            <input type="password" name="password" class="form-input" required minlength="6" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="confirm_password">Confirm Password</label>
            <input type="password" name="confirmPassword" class="form-input" required />
          </div>
        </div>
        <div class="grid grid-2" style="gap:12px">
          <div class="form-group">
            <label class="form-label" data-i18n="native_lang">Native Language</label>
            <select name="nativeLang" class="form-select">
              <option>Uzbek</option>
              <option>Russian</option>
              <option>English</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="learning_lang">Learning Language</label>
            <select name="learningLang" class="form-select">
              <option>English</option>
              <option>German</option>
              <option>French</option>
              <option>Spanish</option>
              <option>Russian</option>
              <option>Japanese</option>
              <option>Korean</option>
              <option>Chinese</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="current_level">Current Level</label>
          <select name="level" class="form-select">
            <option>A1</option>
            <option>A2</option>
            <option selected>B1</option>
            <option>B2</option>
            <option>C1</option>
            <option>C2</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="nav_signup">Sign Up</button>
      </form>
      <div class="auth-footer">
        <span data-i18n="have_account">Already have an account?</span>
        <a href="login.html" data-i18n="nav_login">Login</a>
      </div>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/localization.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
