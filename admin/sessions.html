<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sessions — Admin</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="app-layout admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><span class="font-bold" style="color:#fff">Speakly Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">Overview</a>
        <a href="users.html" class="sidebar-link">Users</a>
        <a href="sessions.html" class="sidebar-link active">Sessions</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="page-header"><h1 class="page-title">Speaking Sessions</h1></header>
      <div class="page-body">
        <div class="card">
          <p class="text-muted mb-4">Recent sessions across the platform (demo data + local).</p>
          <div id="adminSessions"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const sessions = Storage.getSessions();
    const el = document.getElementById('adminSessions');
    if (!sessions.length) {
      el.innerHTML = '<p class="text-muted">No local sessions yet. Platform demo shows sample traffic on overview.</p>';
    } else {
      el.innerHTML = `<table class="table"><thead><tr><th>Date</th><th>Language</th><th>Topic</th><th>Score</th></tr></thead><tbody>
        ${sessions.map(s => `<tr><td>${App.formatDate(s.date)}</td><td>${s.language}</td><td>${s.topic}</td><td>${s.overall}</td></tr>`).join('')}
      </tbody></table>`;
    }
  </script>
</body>
</html>
