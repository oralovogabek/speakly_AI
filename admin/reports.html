<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Admin</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="app-layout admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><span class="font-bold" style="color:#fff">Speakly Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">Overview</a>
        <a href="reports.html" class="sidebar-link active">Reports</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="page-header"><h1 class="page-title">Reports</h1></header>
      <div class="page-body">
        <div class="grid grid-2">
          <div class="card">
            <h3 class="mb-3">Usage report</h3>
            <p class="text-muted text-sm">Export user activity, sessions and minutes. Connect to backend analytics.</p>
            <button class="btn btn-secondary mt-3" onclick="App.toast('Export started (demo)','info')">Export CSV</button>
          </div>
          <div class="card">
            <h3 class="mb-3">Popular features</h3>
            <div class="flex flex-col gap-2 text-sm">
              <div class="flex justify-between"><span>AI Speaking</span><span>48%</span></div>
              <div class="flex justify-between"><span>IELTS</span><span>27%</span></div>
              <div class="flex justify-between"><span>CEFR</span><span>15%</span></div>
              <div class="flex justify-between"><span>Vocabulary</span><span>10%</span></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
