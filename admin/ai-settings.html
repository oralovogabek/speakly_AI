<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Settings — Admin</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="app-layout admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><span class="font-bold" style="color:#fff">Speakly Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">Overview</a>
        <a href="ai-settings.html" class="sidebar-link active">AI Settings</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="page-header"><h1 class="page-title">AI Settings</h1></header>
      <div class="page-body" style="max-width:640px">
        <div class="card mb-4">
          <h3 class="mb-3">Provider (backend only)</h3>
          <p class="text-muted text-sm mb-4">API keys must never be stored in the frontend. Configure providers on the server.</p>
          <div class="form-group">
            <label class="form-label">Default model</label>
            <select class="form-select" disabled>
              <option>gpt-4o-mini (via backend)</option>
              <option>claude-3-haiku</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">API status</label>
            <div class="flex items-center gap-2"><span class="status-dot active"></span> Connected (demo)</div>
          </div>
        </div>
        <div class="card">
          <h3 class="mb-3">Prompt templates</h3>
          <textarea class="form-textarea" rows="4" placeholder="System prompt for speaking evaluation..."></textarea>
          <button class="btn btn-primary mt-3" onclick="App.toast('Saved on backend only (demo)','success')">Save template</button>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
