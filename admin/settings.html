<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Admin</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="app-layout admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><span class="font-bold" style="color:#fff">Speakly Admin</span></div>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">Overview</a>
        <a href="settings.html" class="sidebar-link active">Settings</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="page-header"><h1 class="page-title">Platform Settings</h1></header>
      <div class="page-body" style="max-width:560px">
        <div class="card">
          <div class="form-group">
            <label class="form-label">Platform name</label>
            <input class="form-input" value="Speakly AI" />
          </div>
          <div class="form-group">
            <label class="form-label">Support email</label>
            <input class="form-input" value="support@speakly.ai" />
          </div>
          <div class="form-group">
            <label class="form-label">Maintenance mode</label>
            <select class="form-select"><option>Off</option><option>On</option></select>
          </div>
          <button class="btn btn-primary" onclick="App.toast('Settings saved (demo)','success')">Save</button>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
