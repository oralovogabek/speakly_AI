<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />

  <title>Languages — Speakly AI</title>
  <link rel="stylesheet" href="css/main.css" />

      <nav class="sidebar-nav">

  <script src="js/theme.js"></script>
  <script src="js/localization.js"></script>
